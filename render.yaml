# Render blueprint for open brain memory server
services:
  - type: web
    name: memory-mcp
    runtime: node
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MEMORY_OWNER_UUID
        sync: false
